services:
  pdf-poc:
    build:
      context: .
      dockerfile: Dockerfile.pdf-poc
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
      G2B_DB_SCHEMA: ${G2B_DB_SCHEMA:-public}
      PDF_POC_WORKER_TOKEN: ${PDF_POC_WORKER_TOKEN:?PDF_POC_WORKER_TOKEN is required}
    cpus: 2
    mem_limit: 4g
    shm_size: 256mb
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health',{headers:{authorization:'Bearer '+process.env.PDF_POC_WORKER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
